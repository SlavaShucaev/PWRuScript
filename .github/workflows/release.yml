# Релиз: git tag v1.0.0 && git push origin v1.0.0
# Собирает pwru_script на Ubuntu 22.04 (glibc 2.35: запускается и на более новых системах, включая SteamOS
# на Steam Deck), прогоняет тесты и выкладывает в релиз бинарник и его sha256.
# Скачать последнюю версию: https://github.com/SlavaShucaev/PWRuScript/releases/latest/download/pwru_script
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libarchive-dev

      - name: Сборка и тесты
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPWRU_BUILD_TESTS=ON
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Файлы релиза
        run: |
          mkdir dist
          cp build/pwru_script dist/pwru_script
          strip dist/pwru_script
          chmod +x dist/pwru_script
          (cd dist && sha256sum pwru_script > pwru_script.sha256 && cat pwru_script.sha256)
          ldd dist/pwru_script

      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          name: "PWRuScript ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/pwru_script
            dist/pwru_script.sha256
